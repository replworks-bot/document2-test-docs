<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>document2 test docs</title>
        <meta name="description" content="Sample documentation in laravel/docs format, used by document2 tests.">
        <link rel="canonical" href="https://site.test/d/e2e-pages/5.8/readme">
        <meta property="og:title" content="document2 test docs">
        <meta property="og:description" content="Sample documentation in laravel/docs format, used by document2 tests.">
        <meta property="og:url" content="https://site.test/d/e2e-pages/5.8/readme">
        <meta property="og:type" content="article">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap-grid.min.css" integrity="sha384-VIeCCV0aVHr99fkXDSmzLRuJhJWQXe4bDXs6hgg6w6zOTbtAWr8RqSNWu4a2ef9p" crossorigin="anonymous">
        <style>
            :root { color-scheme: light dark; --site-background: #ffffff; --site-text: #1f2328; }
            body { background-color: var(--site-background); color: var(--site-text); }
            @media (prefers-color-scheme: dark) {
                :root { --site-background: #0d1117; --site-text: #e6edf3; }
                .phiki, .phiki span { color: var(--phiki-dark-color) !important; background-color: var(--phiki-dark-background-color) !important; }
            }

            *, ::before, ::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                line-height: 1.5;
                -webkit-text-size-adjust: 100%;
                tab-size: 4;
            }

            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* Header */
            header {
                position: sticky;
                top: 0;
                z-index: 40;
                width: 100%;
                border-bottom: 1px solid #e5e7eb;
                background-color: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }
            .header-inner {
                max-width: 80rem;
                margin-left: auto;
                margin-right: auto;
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                height: 4rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
            }
            .header-left, .header-right {
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .brand-logo {
                display: flex;
                align-items: center;
                gap: 0.625rem;
                font-weight: 700;
                font-size: 1.125rem;
                color: #111827;
                text-decoration: none;
                letter-spacing: -0.02em;
            }
            .brand-logo a {
                display: flex;
                color: inherit;
            }
            .brand-logo svg {
                width: 1.75rem;
                height: 1.75rem;
                color: #ef4444;
            }
            .brand-logo img {
                height: 1.75rem;
                width: auto;
                max-width: 10rem;
                object-fit: contain;
            }

            /* Controls */
            header select {
                appearance: none;
                -webkit-appearance: none;
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
                background-position: right 0.5rem center;
                background-repeat: no-repeat;
                background-size: 1.25em 1.25em;
                padding: 0.375rem 2rem 0.375rem 0.75rem;
                font-size: 0.875rem;
                font-weight: 600;
                border-radius: 0.5rem;
                border: 1px solid #d1d5db;
                background-color: #ffffff;
                color: #374151;
                cursor: pointer;
                transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            header select:focus {
                outline: none;
                border-color: #ef4444;
                box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
            }

            .search-box {
                position: relative;
            }
            .search-input-wrapper {
                position: relative;
                display: flex;
                align-items: center;
            }
            .search-icon {
                position: absolute;
                left: 0.625rem;
                width: 1rem;
                height: 1rem;
                color: #9ca3af;
                pointer-events: none;
            }
            header input[type="search"] {
                width: 16rem;
                font-size: 0.875rem;
                padding: 0.375rem 0.75rem 0.375rem 2.25rem;
                border-radius: 0.5rem;
                border: 1px solid #d1d5db;
                background-color: #f9fafb;
                color: #111827;
                transition: all 0.15s ease-in-out;
            }
            header input[type="search"]:focus {
                outline: none;
                background-color: #ffffff;
                border-color: #ef4444;
                box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
            }

            [data-search-url] ul {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                margin-top: 0.5rem;
                min-width: 18rem;
                background-color: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
                max-height: 24rem;
                overflow-y: auto;
                z-index: 50;
                padding: 0.375rem;
            }
            [data-search-url] ul[hidden] {
                display: none !important;
            }
            [data-search-url] ul li {
                list-style: none;
            }
            [data-search-url] ul li a {
                display: block;
                padding: 0.625rem 0.875rem;
                font-size: 0.875rem;
                font-weight: 500;
                color: #374151;
                border-radius: 0.5rem;
                transition: all 0.15s ease-in-out;
                text-decoration: none;
            }
            [data-search-url] ul li a:hover {
                background-color: #fef2f2;
                color: #ef4444;
            }
            [data-search-url] ul li[data-test="no-results"] {
                padding: 0.75rem 1rem;
                font-size: 0.875rem;
                color: #9ca3af;
                font-style: italic;
            }

            .header-links {
                display: flex;
                align-items: center;
                gap: 0.25rem;
            }
            .header-links a {
                padding: 0.375rem 0.75rem;
                font-size: 0.875rem;
                font-weight: 500;
                color: #4b5563;
                border-radius: 0.5rem;
                text-decoration: none;
            }
            .header-links a:hover {
                color: #111827;
                background-color: #f3f4f6;
            }
            footer {
                margin-top: 3rem;
                padding-top: 1.5rem;
                border-top: 1px solid #f3f4f6;
                font-size: 0.8125rem;
                color: #6b7280;
                white-space: pre-line;
            }

            [data-test="EL-108"] {
                display: inline-flex;
                align-items: center;
                gap: 0.375rem;
                padding: 0.375rem 0.75rem;
                font-size: 0.875rem;
                font-weight: 500;
                color: #4b5563;
                border-radius: 0.5rem;
                transition: all 0.15s ease-in-out;
                text-decoration: none;
                border: 1px solid #e5e7eb;
            }
            [data-test="EL-108"]:hover {
                color: #111827;
                background-color: #f3f4f6;
            }

            /* Main Layout */
            .layout-container {
                flex: 1;
                max-width: 80rem;
                width: 100%;
                margin-left: auto;
                margin-right: auto;
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                display: flex;
            }

            /* Sidebar */
            nav {
                padding-top: 2rem;
                padding-bottom: 2rem;
                padding-right: 1.5rem;
                border-right: 1px solid #f3f4f6;
                position: sticky;
                top: 4rem;
                height: calc(100vh - 4rem);
                overflow-y: auto;
            }
            nav details {
                margin-bottom: 1.75rem;
            }
            nav summary {
                list-style: none;
                cursor: pointer;
                font-size: 1rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #6b7280;
                margin-bottom: 0.5rem;
                padding-left: 0.75rem;
            }
            nav summary::-webkit-details-marker {
                display: none;
            }
            nav ul {
                list-style: none;
                padding-left: 0.75rem;
            }
            nav li {
                margin-bottom: 0.125rem;
            }
            nav a {
                display: flex;
                align-items: center;
                padding: 0.375rem 0.75rem;
                font-size: 0.875rem;
                line-height: 1.25rem;
                color: #4b5563;
                border-radius: 0.375rem;
                text-decoration: none;
                transition: all 0.15s ease-in-out;
            }
            nav a:hover {
                color: #111827;
                background-color: #f3f4f6;
            }
            nav a[aria-current="page"] {
                color: #ef4444 !important;
                font-weight: 600 !important;
                background-color: #fef2f2 !important;
                border-left: 3px solid #ef4444;
                border-top-left-radius: 0 !important;
                border-bottom-left-radius: 0 !important;
            }

            /* Content Area */
            .content-wrapper {
                min-width: 0;
                padding: 2.5rem 3rem;
                max-width: 52rem;
            }

            @media (max-width: 767.98px) {
                .header-inner {
                    height: auto;
                    min-height: 4rem;
                    padding: 0.75rem 1rem;
                    display: grid;
                    grid-template-columns: minmax(0, 1fr);
                    gap: 0.75rem;
                }
                .header-left {
                    justify-content: space-between;
                    min-width: 0;
                }
                .header-right {
                    width: 100%;
                    min-width: 0;
                }
                .search-box {
                    flex: 1;
                    min-width: 0;
                }
                header input[type="search"] {
                    width: 100%;
                }
                [data-search-url] ul {
                    min-width: min(18rem, calc(100vw - 2rem));
                }
                .layout-container {
                    padding-left: 1rem;
                    padding-right: 1rem;
                }
                .layout-container nav {
                    position: static;
                    height: auto;
                    overflow: visible;
                    padding: 1.5rem 0.5rem 1.5rem 0;
                }
                nav summary {
                    padding-left: 0.375rem;
                    overflow-wrap: anywhere;
                }
                nav a {
                    padding: 0.375rem;
                    overflow-wrap: anywhere;
                }
                .content-wrapper {
                    padding: 1.5rem 0.75rem;
                }
            }

            [data-test="EL-109"] {
                font-size: 0.8125rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #ef4444;
                margin-bottom: 0.5rem;
            }

            /* Markdown Content */
            main h1 {
                font-size: 2.25rem;
                line-height: 2.5rem;
                font-weight: 800;
                letter-spacing: -0.025em;
                color: #111827;
                margin-bottom: 1.5rem;
                padding-bottom: 0.75rem;
                border-bottom: 1px solid #e5e7eb;
            }
            main h2 {
                font-size: 1.5rem;
                line-height: 2rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                color: #111827;
                margin-top: 2.5rem;
                margin-bottom: 1rem;
                padding-bottom: 0.5rem;
                border-bottom: 1px solid #f3f4f6;
            }
            main h3 {
                font-size: 1.25rem;
                line-height: 1.75rem;
                font-weight: 600;
                color: #1f2328;
                margin-top: 2rem;
                margin-bottom: 0.75rem;
            }
            main p {
                font-size: 1rem;
                line-height: 1.75;
                color: #374151;
                margin-top: 1rem;
                margin-bottom: 1rem;
            }
            main a {
                color: #ef4444;
                text-decoration: underline;
                text-underline-offset: 3px;
                text-decoration-color: #fca5a5;
                font-weight: 500;
                transition: color 0.15s ease-in-out;
            }
            main a:hover {
                color: #dc2626;
                text-decoration-color: #ef4444;
            }
            main ul {
                list-style-type: disc;
                padding-left: 1.5rem;
                margin-top: 1rem;
                margin-bottom: 1rem;
            }
            main ol {
                list-style-type: decimal;
                padding-left: 1.5rem;
                margin-top: 1rem;
                margin-bottom: 1rem;
            }
            main li {
                line-height: 1.75;
                color: #374151;
                margin-top: 0.375rem;
                margin-bottom: 0.375rem;
            }
            main blockquote {
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
                padding: 1rem 1.25rem;
                border-left: 4px solid #ef4444;
                background-color: #fef2f2;
                border-radius: 0 0.5rem 0.5rem 0;
                color: #4b5563;
            }
            main blockquote p {
                margin: 0;
            }
            main .markdown-alert {
                --alert-color: #0969da;
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
                padding: 0.5rem 1rem;
                border-left: 0.25em solid var(--alert-color);
                color: inherit;
            }
            main .markdown-alert > :last-child {
                margin-bottom: 0;
            }
            main .markdown-alert .markdown-alert-title {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-top: 0;
                font-weight: 500;
                line-height: 1;
                color: var(--alert-color);
            }
            main .markdown-alert .octicon {
                fill: currentColor;
                flex-shrink: 0;
            }
            main .markdown-alert-tip { --alert-color: #1a7f37; }
            main .markdown-alert-important { --alert-color: #8250df; }
            main .markdown-alert-warning { --alert-color: #9a6700; }
            main .markdown-alert-caution { --alert-color: #d1242f; }
            main .footnote-ref {
                text-decoration: none;
            }
            main .footnotes {
                margin-top: 3rem;
                padding-top: 1rem;
                border-top: 1px solid #e5e7eb;
                font-size: 0.875rem;
            }
            main .footnote-backref {
                text-decoration: none;
            }
            main .math-display {
                display: block;
                margin-top: 1rem;
                margin-bottom: 1rem;
                overflow-x: auto;
            }
            main .code-block {
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem;
                overflow: hidden;
            }
            main .code-block .phiki {
                margin: 0;
                padding-left: 0;
                padding-right: 0;
                border-radius: 0;
                box-shadow: none;
            }
            main .code-header {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.25rem 0.5rem 0.25rem 1.25rem;
                font-size: 0.75rem;
                color: #57606a;
                background-color: #f6f8fa;
                border-bottom: 1px solid #e5e7eb;
            }
            main .code-copy {
                display: inline-flex;
                margin-left: auto;
                padding: 0.375rem;
                border: 0;
                border-radius: 0.375rem;
                background: transparent;
                color: inherit;
                cursor: pointer;
            }
            main .code-copy:hover {
                background-color: rgba(0, 0, 0, 0.06);
            }
            main .code-copy .octicon {
                fill: currentColor;
            }
            main .code-copy .octicon-check,
            main .code-copy[data-copied] .octicon-copy {
                display: none;
            }
            main .code-copy[data-copied] .octicon-check {
                display: inline;
                color: #1a7f37;
            }
            main .tabbed-code {
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem;
                overflow: hidden;
            }
            main .tabbed-code-nav {
                display: flex;
                overflow-x: auto;
                background-color: #f6f8fa;
                border-bottom: 1px solid #e5e7eb;
            }
            main .tabbed-code-nav-button {
                padding: 0.5rem 1rem;
                border: 0;
                border-bottom: 2px solid transparent;
                background: transparent;
                font-size: 0.875rem;
                color: #57606a;
                white-space: nowrap;
                cursor: pointer;
            }
            main .tabbed-code-nav-button.active {
                color: #1f2328;
                border-bottom-color: #ef4444;
            }
            main .tabbed-code .code-container {
                display: none;
            }
            main .tabbed-code .code-container.active {
                display: block;
            }
            main .tabbed-code .code-block {
                margin: 0;
                border: 0;
                border-radius: 0;
            }
            main .phiki code {
                display: inline-block;
                min-width: 100%;
            }
            main .phiki .line {
                display: block;
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }
            main .phiki .line-number {
                margin-right: 1.25rem;
                color: #8c959f;
                user-select: none;
                -webkit-user-select: none;
            }
            main .phiki .line.diff-add { background-color: #f0fff4; }
            main .phiki .line.diff-remove { background-color: #ffeef0; }
            main pre.mermaid[data-processed] {
                text-align: center;
                background: transparent;
                box-shadow: none;
            }
            main img.emoji {
                display: inline;
                height: 1.25em;
                width: 1.25em;
                vertical-align: -0.25em;
            }
            main code:not(pre code) {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 0.875em;
                font-weight: 500;
                color: #ef4444;
                background-color: #f3f4f6;
                padding: 0.125rem 0.375rem;
                border-radius: 0.375rem;
                border: 1px solid rgba(0, 0, 0, 0.05);
            }
            main pre,
            main .phiki {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 0.875rem;
                line-height: 1.7;
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
                padding: 1.25rem;
                border-radius: 0.75rem;
                overflow-x: auto;
                box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
                border: 1px solid #e5e7eb;
            }
            main table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 1.5rem;
                margin-bottom: 1.5rem;
                font-size: 0.875rem;
                border: 1px solid #e5e7eb;
                border-radius: 0.5rem;
                overflow: hidden;
            }
            main th {
                background-color: #f9fafb;
                color: #111827;
                font-weight: 600;
                text-align: left;
                padding: 0.75rem 1rem;
                border-bottom: 1px solid #e5e7eb;
            }
            main td {
                padding: 0.75rem 1rem;
                border-bottom: 1px solid #f3f4f6;
                color: #374151;
            }

            /* Dark mode */
            @media (prefers-color-scheme: dark) {
                header {
                    border-bottom-color: #1f2937;
                    background-color: rgba(13, 17, 23, 0.9);
                }
                .brand-logo {
                    color: #ffffff;
                }
                header select {
                    border-color: #30363d;
                    background-color: #161b22;
                    color: #c9d1d9;
                    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%238b949e' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
                }
                header select:focus {
                    border-color: #f87171;
                    box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.25);
                }
                header input[type="search"] {
                    border-color: #30363d;
                    background-color: #161b22;
                    color: #f0f6fc;
                }
                header input[type="search"]:focus {
                    background-color: #0d1117;
                    border-color: #f87171;
                    box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.25);
                }
                [data-search-url] ul {
                    background-color: #161b22;
                    border-color: #30363d;
                    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
                }
                [data-search-url] ul li a {
                    color: #c9d1d9;
                }
                [data-search-url] ul li a:hover {
                    background-color: rgba(239, 68, 68, 0.15);
                    color: #f87171;
                }
                [data-search-url] ul li[data-test="no-results"] {
                    color: #6e7681;
                }
                [data-test="EL-108"] {
                    color: #8b949e;
                    border-color: #30363d;
                }
                [data-test="EL-108"]:hover {
                    color: #f0f6fc;
                    background-color: #21262d;
                }
                .header-links a {
                    color: #8b949e;
                }
                .header-links a:hover {
                    color: #f0f6fc;
                    background-color: #21262d;
                }
                footer {
                    border-top-color: #1f2937;
                    color: #8b949e;
                }

                nav {
                    border-right-color: #1f2937;
                }
                nav summary {
                    color: #8b949e;
                }
                nav a {
                    color: #8b949e;
                }
                nav a:hover {
                    color: #f0f6fc;
                    background-color: #161b22;
                }
                nav a[aria-current="page"] {
                    color: #f87171 !important;
                    background-color: rgba(239, 68, 68, 0.15) !important;
                    border-left-color: #f87171 !important;
                }

                [data-test="EL-109"] {
                    color: #f87171;
                }

                main h1 {
                    color: #f9fafb;
                    border-bottom-color: #1f2937;
                }
                main h2 {
                    color: #f3f4f6;
                    border-bottom-color: #1f2937;
                }
                main h3 {
                    color: #e5e7eb;
                }
                main p {
                    color: #d1d5db;
                }
                main a {
                    color: #f87171;
                    text-decoration-color: #7f1d1d;
                }
                main a:hover {
                    color: #fca5a5;
                    text-decoration-color: #ef4444;
                }
                main li {
                    color: #d1d5db;
                }
                main blockquote {
                    background-color: rgba(239, 68, 68, 0.08);
                    border-left-color: #f87171;
                    color: #9ca3af;
                }
                main .code-block,
                main .code-header {
                    border-color: #30363d;
                }
                main .tabbed-code,
                main .tabbed-code-nav {
                    border-color: #30363d;
                }

        <script>
            (() => {
                const container = document.querySelector('[data-search-url]');
                const input = container.querySelector('[data-test="EL-106"]');
                const results = container.querySelector('[data-test="EL-107"]');
                let latest = 0;

                const noResults = () => {
                    const entry = document.createElement('li');
                    entry.textContent = 'No results.';
                    entry.dataset.test = 'no-results';
                    return entry;
                };

                const show = (items) => {
                    results.replaceChildren(...(items.length ? items.map((item) => {
                        const link = document.createElement('a');
                        link.href = container.dataset.versionBase + '/' + item.slug;
                        link.textContent = item.title;
                        const entry = document.createElement('li');
                        entry.append(link);
                        return entry;
                    }) : [noResults()]));
                    results.hidden = false;
                };

                input.addEventListener('input', async () => {
                    const query = input.value.trim();
                    const request = ++latest;

                    if (query === '') {
                        results.hidden = true;
                        results.replaceChildren();
                        return;
                    }

                    try {
                        const url = new URL(container.dataset.searchUrl, window.location.href);
                        url.search = new URLSearchParams({ project: container.dataset.searchProject, version: container.dataset.searchVersion, q: query });
                        const response = await fetch(url, { credentials: 'omit' });
                        const data = response.ok ? await response.json() : { results: [] };
                        if (request === latest) show(data.results ?? []);
                    } catch {
                        if (request === latest) show([]);
                    }
                });
            })();
        </script>
        <script>
            (() => {
                const navigation = document.querySelector('[data-test="EL-101"]');
                const active = navigation.querySelector('[aria-current="page"]');

                if (active) {
                    const box = navigation.getBoundingClientRect();
                    const link = active.getBoundingClientRect();
                    navigation.scrollTop += (link.top + link.height / 2) - (box.top + box.height / 2);
                }
            })();

            document.querySelectorAll('[data-test="EL-101"] details').forEach((section, _, sections) => {
                section.addEventListener('toggle', () => {
                    if (section.open) {
                        sections.forEach((other) => {
                            if (other !== section) other.open = false;
                        });
                    }
                });
            });
        </script>
        <script>
            document.querySelectorAll('main .code-copy').forEach((button) => {
                const label = button.getAttribute('aria-label');

                button.addEventListener('click', async () => {
                    const lines = button.closest('.code-block').querySelectorAll('pre code .line');
                    const text = [...lines].map((line) => [...line.childNodes]
                        .filter((node) => ! node.classList?.contains('line-number'))
                        .map((node) => node.textContent)
                        .join('')).join('').replace(/\n$/, '');

                    try {
                        await navigator.clipboard.writeText(text);
                    } catch {
                        return;
                    }

                    button.dataset.copied = '';
                    button.setAttribute('aria-label', button.dataset.copiedLabel);
                    setTimeout(() => {
                        delete button.dataset.copied;
                        button.setAttribute('aria-label', label);
                    }, 2000);
                });
            });
        </script>
